<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kayli 💘 Valentine Request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 22px;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      animation: fadeIn 1s ease;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      margin: 18px 0;
    }

    button {
      border: none;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      margin: 8px;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .yes {
      background: #ff4f81;
      color: white;
    }

    .no {
      background: #ddd;
      color: #555;
      position: absolute;
    }

    .footer {
      margin-top: 18px;
      font-size: 14px;
      color: #777;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <h1>Hey Kayli 👀💘</h1>
    <p id="text">Quick question…</p>

    <button class="yes" onclick="next()">Next 👉</button>

    <div class="footer">
      Please answer honestly (I’m scared)
    </div>
  </div>

  <script>
    const messages = [
      "I was going to make this really romantic…",
      "But I decided funny is more my brand 😌",
      "So here we are.",
      "Kayli…",
      "You make every day better.",
      "Even when you say you're 'ready in 5 minutes.'",
      "Especially then, actually.",
      "So I have one very important question…",
      "Will you be my Valentine? 💖"
    ];

    let index = 0;

    function next() {
      index++;
      if (index < messages.length) {
        document.getElementById("text").innerHTML = messages[index];
      } else {
        showValentine();
      }
    }

    function showValentine() {
      document.getElementById("card").innerHTML = `
        <h1>Kayli 💘</h1>
        <p>Will you be my Valentine?</p>
        <button class="yes" onclick="yes()">YES 💖</button>
        <button class="no" id="noBtn" onmouseover="moveNo()">No 🙄</button>
      `;
    }

    function moveNo() {
      const btn = document.getElementById("noBtn");
      const x = Math.random() * 250 - 125;
      const y = Math.random() * 250 - 125;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function yes() {
      document.getElementById("card").innerHTML = `
        <h1>💘 LET’S GO 💘</h1>
        <p>I knew it 😎<br>
        Best Valentine ever.</p>
        <p>See you on Valentine’s Day ❤️</p>
      `;
    }
  </script>

</body>
</html>
